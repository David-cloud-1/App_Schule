<title>Neuer Lehrkräfte-Bereich</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: Seitenleiste links ab 1024 px, darunter Schublade; Inhalt bis 1200 px, Formulare schmal.
   Farben = ws-Tokens aus src/app/globals.css (hell Standard, dunkel gespiegelt). Grün nur für Hauptaktion und Erfolg. */
:root{
  --bg:#F7F6F2; --surface:#FFFFFF; --raised:#EFEDE7; --line:#DDD9CF;
  --text:#1D2420; --muted:#5C655F; --faint:#6A726C;
  --green:#26640C; --green-h:#1F520A; --blue:#095F90; --red:#AA2222; --orange:#8D4700; --gold:#715900;
  --on:#FFFFFF; --shadow:0 1px 2px rgba(29,36,32,.06),0 4px 16px rgba(29,36,32,.06);
  --scrim:rgba(20,23,20,.38);
  --font:Figtree,"Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141714; --surface:#1B1F1B; --raised:#242924; --line:#343B34;
  --text:#F1F3EF; --muted:#A3ACA4; --faint:#8E978F;
  --green:#7ED33C; --green-h:#6BBB2F; --blue:#3EBCF7; --red:#FF7B7B; --orange:#FF9600; --gold:#FFD700;
  --on:#141714; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141714; --surface:#1B1F1B; --raised:#242924; --line:#343B34;
  --text:#F1F3EF; --muted:#A3ACA4; --faint:#8E978F;
  --green:#7ED33C; --green-h:#6BBB2F; --blue:#3EBCF7; --red:#FF7B7B; --orange:#FF9600; --gold:#FFD700;
  --on:#141714; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
h1{font-size:1.65rem;line-height:1.2;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1.15rem;line-height:1.3;font-weight:700;text-wrap:balance}
h3{font-size:1rem;font-weight:600}
a{color:var(--blue)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.875rem}
.tabnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Rahmen */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);background:var(--bg);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-weight:700;padding:4px 12px 12px;display:flex;align-items:center;gap:10px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--green);color:var(--on);display:grid;place-items:center;font-size:14px}
.bereich{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;min-height:52px;margin-bottom:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.bereich small{display:block;color:var(--muted);font-size:.8rem;line-height:1.2}
.bereich b{font-weight:600;line-height:1.3}
.bereich .ic{margin-left:auto;color:var(--muted)}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:var(--text);text-decoration:none;font-weight:500}
.nav .ic{color:var(--muted)}
.nav small{margin-left:auto;color:var(--faint);font-size:.78rem;font-weight:500}
.nav:hover{background:var(--raised)}
.nav.on{background:var(--raised);font-weight:700}
.nav.on .ic{color:var(--text)}
.nav-sep{height:1px;background:var(--line);margin:10px 12px}
.grp summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;font-weight:500;color:var(--text)}
.grp summary::-webkit-details-marker{display:none}
.grp summary .ic{color:var(--muted)}
.grp summary .ch{margin-left:auto;transition:transform .2s ease-out}
.grp[open] summary .ch{transform:rotate(180deg)}
.grp summary:hover{background:var(--raised)}
.grp .nav{padding-left:44px;font-weight:400;color:var(--muted)}
.grp .nav.on{color:var(--text);font-weight:600}
.grp .tag{font-size:.72rem;color:var(--faint);margin-left:auto;white-space:nowrap}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;background:var(--raised);font-size:.875rem;color:var(--muted)}
.side-foot b{color:var(--text);display:block}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;min-height:64px;padding-block:10px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));border-bottom:1px solid transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;color:var(--muted);font-size:.95rem}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--text);text-decoration:underline}
.crumb b{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.search{position:relative;width:min(340px,40vw)}
.search input{width:100%;height:44px;padding:0 14px 0 40px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.search .ic{position:absolute;left:12px;top:12px;color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:700;cursor:pointer}
.menu-btn{display:none}
.view{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));padding-block:8px 120px;width:100%;max-width:1264px}
.scrim{display:none}

@media (max-width:1023px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:45;background:var(--surface);transform:translateX(-102%);transition:transform .2s ease-out;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:calc(12px + env(safe-area-inset-left,0px))}
  .app.drawer .side{transform:none;box-shadow:var(--shadow)}
  .app.drawer .scrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:44}
  .menu-btn{display:grid}
  .top,.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .search{width:auto;flex:1;min-width:0}
  .crumb{display:none}
}

/* Bausteine */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s ease-out,transform .1s}
.btn:hover{background:var(--raised)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on)}
.btn.primary:hover{background:var(--green-h)}
.btn.danger{background:var(--red);border-color:var(--red);color:var(--on)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--raised)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--raised);color:var(--text)}
.icon-btn.outline{border-color:var(--line);background:var(--surface)}
.ph{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-block:16px 24px}
.ph > div:first-child{flex:1 1 320px;min-width:0}
.ph p{color:var(--muted);margin-top:6px;max-width:65ch}
.ph-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.card-pad{padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;border:1px solid var(--line);background:var(--raised);color:var(--muted);white-space:nowrap}
.pill.g{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green);border-color:color-mix(in srgb,var(--green) 30%,transparent)}
.pill.b{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);border-color:color-mix(in srgb,var(--blue) 30%,transparent)}
.pill.o{background:color-mix(in srgb,var(--orange) 14%,transparent);color:var(--orange);border-color:color-mix(in srgb,var(--orange) 30%,transparent)}
.pill.r{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--raised);color:var(--muted);font-size:.92rem}
.note b{color:var(--text)}
.note.o{background:color-mix(in srgb,var(--orange) 12%,transparent);color:var(--text)}
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.lbl{font-weight:600;font-size:.95rem}
.field .hint{color:var(--muted);font-size:.85rem}
.field .err{color:var(--red);font-size:.88rem;font-weight:600}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
textarea.inp{min-height:88px;resize:vertical;line-height:1.45}
.inp:focus{outline:2px solid var(--green);outline-offset:0;border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:12px;background:var(--raised);border:1px solid var(--line);flex-wrap:wrap}
.seg button{min-height:38px;padding:0 14px;border-radius:9px;border:0;background:transparent;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--text);font-weight:700;box-shadow:var(--shadow)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.stepper button{width:44px;height:44px;border:0;background:transparent;cursor:pointer;font-size:1.2rem}
.stepper input{width:56px;height:44px;border:0;text-align:center;background:transparent;font-weight:700}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;min-height:44px;font-size:.88rem;color:var(--muted);white-space:nowrap}
.switch input{appearance:none;width:40px;height:24px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s ease-out;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--green)}
.switch input:checked::after{transform:translateX(16px)}
.check{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding-top:10px;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--green);flex:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:16px}
.tabs button{min-height:44px;padding:0 14px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--green)}
.tabs .cnt{font-weight:500;color:var(--faint);margin-left:4px}
.empty{padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted)}
.empty .ic{width:32px;height:32px;color:var(--faint)}
.empty b{color:var(--text);font-size:1.05rem}
mark{background:color-mix(in srgb,var(--gold) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* Start */
.home{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.home{grid-template-columns:minmax(0,1fr)}}
.list-rows > li{display:flex;align-items:center;gap:14px;padding:14px 20px;border-top:1px solid var(--line)}
.list-rows > li:first-child{border-top:0}
.list-rows .txt{flex:1;min-width:0}
.list-rows .txt b{display:block;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--orange)}
.dot.b{background:var(--blue)} .dot.g{background:var(--green)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 20px 12px}
.card-h h2{flex:1}
.steps-first li{display:flex;gap:12px;padding:10px 0;align-items:flex-start}
.steps-first .n{width:28px;height:28px;border-radius:50%;background:var(--raised);display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:none}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;letter-spacing:.08em}

/* Tabellen & Karten */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:.85rem;font-weight:600;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:14px 16px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl td.act{text-align:right;width:1%;white-space:nowrap}
.tbl tbody tr:hover{background:color-mix(in srgb,var(--raised) 50%,transparent)}
.tbl a.title{color:var(--text);font-weight:600;text-decoration:none}
.tbl a.title:hover{text-decoration:underline}
.cards{display:none}
@media (max-width:760px){.tbl-wrap.resp{display:none}.cards{display:flex;flex-direction:column;gap:12px}}
.mcard{padding:16px;display:flex;flex-direction:column;gap:8px}
.mcard .row{justify-content:space-between}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filters .search-inp{flex:1 1 240px;position:relative}
.filters .search-inp .ic{position:absolute;left:12px;top:12px;color:var(--muted)}
.filters .search-inp input{padding-left:40px}
.filters select{width:auto;min-width:180px}

/* Lerninhalte */
.li{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.li{grid-template-columns:minmax(0,1fr)}}
.tree{padding:8px;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow-y:auto}
@media (max-width:960px){.tree{position:static;max-height:none}}
.tree-mobile{display:none}
@media (max-width:960px){.tree-mobile{display:block}.tree-desk{display:none}}
.tnode{display:flex;align-items:center;gap:4px}
.tbtn{flex:1;min-width:0;display:flex;align-items:flex-start;gap:8px;text-align:left;min-height:44px;padding:10px;border-radius:10px;border:0;background:transparent;cursor:pointer;color:var(--text)}
.tbtn:hover{background:var(--raised)}
.tbtn[aria-current="true"]{background:var(--raised);font-weight:700}
.tbtn .nm{flex:1;min-width:0}
.tbtn .nm small{display:block;color:var(--muted);font-weight:400;font-size:.82rem;line-height:1.3}
.tbtn .c{color:var(--faint);font-weight:500;font-size:.88rem;font-variant-numeric:tabular-nums}
.ttog{width:32px;height:44px;border:0;background:transparent;cursor:pointer;color:var(--muted);display:grid;place-items:center;flex:none;border-radius:8px}
.ttog:hover{background:var(--raised)}
.ttog .ic{transition:transform .15s}
.ttog[aria-expanded="true"] .ic{transform:rotate(90deg)}
.tchildren{padding-left:28px}
.tchildren .tbtn{font-weight:500}
.tchildren .tbtn[aria-current="true"]{font-weight:700}
.qlist > li{display:flex;gap:16px;padding:16px 20px;border-top:1px solid var(--line);align-items:flex-start}
.qlist > li:first-child{border-top:0}
.qmain{flex:1;min-width:0}
.qtext{font-weight:500}
.qmeta{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.86rem;margin-top:4px}
.qnote{font-size:.85rem;color:var(--orange);margin-top:4px}
.qact{display:flex;align-items:center;gap:2px;flex:none}
@media (max-width:600px){.qlist > li{flex-direction:column;gap:6px}.qact{align-self:stretch;justify-content:flex-end}}
.lhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.lhead h2{flex:1;min-width:0}
.bar{height:8px;border-radius:999px;background:var(--raised);overflow:hidden;width:90px;flex:none}
.bar i{display:block;height:100%;background:var(--orange)}

/* Assistent */
.wizsteps{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.wizsteps li{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:600}
.wizsteps li .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--raised);font-size:.9rem}
.wizsteps li[aria-current="step"]{color:var(--text);border-color:var(--text)}
.wizsteps li[aria-current="step"] .n{background:var(--text);color:var(--bg)}
.wizsteps li.done .n{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.wiz{max-width:780px}
.wiz-foot{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.wiz-foot .r{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.sel-list > li{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-top:1px solid var(--line)}
.sel-list > li:first-child{border-top:0}
.sel-list .num{width:26px;color:var(--faint);font-weight:700;font-variant-numeric:tabular-nums;padding-top:1px;flex:none}
.sel-list .qa{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:600px){.sel-list > li{flex-wrap:wrap}.sel-list .qa{width:100%}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:.9rem}
.chip:hover{background:var(--raised)}
.chip[aria-pressed="true"]{border-color:var(--text);font-weight:700}
details.more{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.more summary{cursor:pointer;min-height:48px;display:flex;align-items:center;padding:0 16px;font-weight:600}
details.more > div{padding:0 16px 16px}

/* Detail */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-bottom:20px}
.flow li{position:relative;padding:14px 16px 14px 16px;border:1px solid var(--line);background:var(--surface);margin-left:-1px}
.flow li:first-child{border-radius:12px 0 0 12px;margin-left:0}
.flow li:last-child{border-radius:0 12px 12px 0}
.flow li b{display:flex;align-items:center;gap:8px}
.flow li small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
.flow li.done b{color:var(--muted)}
.flow li.done b .ic{color:var(--green)}
.flow li.now{background:var(--raised);border-color:var(--text);z-index:1}
.flow li .n{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:.75rem}
@media (max-width:700px){.flow{grid-template-columns:minmax(0,1fr)}.flow li,.flow li:first-child,.flow li:last-child{border-radius:0;margin-left:0;margin-top:-1px}.flow li:first-child{border-radius:12px 12px 0 0}.flow li:last-child{border-radius:0 0 12px 12px}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:20px}
.facts > div{background:var(--surface);padding:14px 16px}
.facts dt{font-size:.82rem;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600}
.facts .code{font-size:1.15rem}

/* Ebenen: Menü, Dialog, Schublade, Hinweis */

const subjects=()=>S.subjects.filter(s=>s.bereich===S.bereich);

const inBereich=x=>topicInfo(x.topic)?.s.bereich===S.bereich;

const norm=s=>String(s).toLowerCase().replace(/[„“"'?!.,:;()–-]/g,' ').replace(/\s+/g,' ').trim();
function matches(x,query){const terms=norm(query).split(' ').filter(Boolean);if(!terms.length)return true;const hay=norm(x.text+' '+x.answers.join(' '));return terms.every(t=>hay.includes(t))}
function hl(text,query){let h=esc(text);const terms=norm(query).split(' ').filter(t=>t.length>1);for(const t of terms){h=h.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>')}return h}
const tpl=id=>S.templates.find(t=>t.id===id)||S.templates[0];
function grade(pct,key){const th=tpl(key).th;for(let i=0;i<th.length;i++)if(pct>=th[i])return i+1;return 6}
function results(a){const max=a.qids.length;const done=a.people.filter(p=>p.abgabe);const rows=done.map(p=>{const pts=p.res.filter(Boolean).length;const pct=Math.round(pts/max*100);return {...p,pts,pct,note:grade(pct,a.key)}});const avg=rows.length?rows.reduce((s,r)=>s+r.note,0)/rows.length:0;return {max,rows,avg,missing:a.people.filter(p=>!p.abgabe)}}
function itemStats(a){const {rows}=results(a);if(!rows.length)return a.qids.map(()=>null);const sorted=[...rows].sort((x,y)=>y.pts-x.pts);const half=Math.floor(sorted.length/2);const top=sorted.slice(0,half),bot=sorted.slice(-half);return a.qids.map((_,k)=>{const p=rows.filter(r=>r.res[k]).length/rows.length;const d=top.filter(r=>r.res[k]).length/half-bot.filter(r=>r.res[k]).length/half;return {p:Math.round(p*100),trennt:d>=.3?'gut':d<.1?'kaum':'mittel'}})}

 return PH('Leistungsnachweise','Benotete Tests für deine Klasse: anlegen, Code verteilen, auswerten.',`<button class="btn primary" data-act="wiz-new">${ic('plus')}Neuer Leistungsnachweis</button>`)+
 `<div class="filters"><div class="search-inp">${ic('search')}<input class="inp" type="search" id="lnq" placeholder="Titel, Klasse oder Code" value="${esc(S.ln.q)}" data-inp="lnq" aria-label="Leistungsnachweise durchsuchen"></div>
  <select class="inp" id="lnstatus" data-chg="lnstatus" aria-label="Stand"><option value="alle">Alle Stände</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${S.ln.status===k?'selected':''}>${v[0]}</option>`).join('')}</select></div>
  <div id="lnlist">${lnList()}</div>`}
function lnList(){const qq=norm(S.ln.q);const list=assessments().filter(a=>(S.ln.status==='alle'||a.status===S.ln.status)&&(!qq||norm(a.titel+' '+a.klasse+' '+a.code).includes(qq)));
 if(!list.length)return `<div class="card empty">${ic('search')}<b>Nichts gefunden</b><button class="btn" data-act="ln-reset">Suche und Filter zurücksetzen</button></div>`;
 const when=a=>a.datum?`${fmtDs(a.datum)}, ${a.beginn}`:'<span class="faint">noch kein Termin</span>';
 return `<div class="card tbl-wrap resp"><table class="tbl"><thead><tr><th>Titel</th><th>Klasse</th><th>Termin</th><th>Stand</th><th><span class="sr">Aktion</span></th></tr></thead><tbody>
 ${list.map(a=>`<tr><td><a class="title" href="#nachweis-${a.id}">${esc(a.titel)}</a><div class="muted small">${a.qids.length} Fragen</div></td><td>${esc(a.klasse)}</td><td class="tabnum">${when(a)}</td><td>${statusPill(a)}<div class="muted small">${statusLine(a)}</div></td><td class="act"><a class="btn" href="#nachweis-${a.id}">Öffnen</a></td></tr>`).join('')}
 </tbody></table></div>
 <div class="cards">${list.map(a=>`<a class="card mcard" href="#nachweis-${a.id}" style="color:inherit;text-decoration:none"><div class="row"><b>${esc(a.titel)}</b>${statusPill(a)}</div><span class="muted small">${esc(a.klasse)} · ${when(a)}${a.code&&a.status==='offen'?` · Code <span class="code">${a.code}</span>`:''}</span><span class="muted small">${statusLine(a)}</span></a>`).join('')}</div>`}

/* ---------- Detail ---------- */
function vDetail(id){const a=S.assessments.find(x=>x.id===id);if(!a)return PH('Nicht gefunden','Diesen Leistungsnachweis gibt es nicht.',`<a class="btn" href="#nachweise">Zur Liste</a>`);
 const order=['entwurf','offen','geschlossen','freigegeben'];const idx=order.indexOf(a.status);
 const flowTxt={entwurf:'Nur du siehst ihn',offen:'Azubis treten mit Code bei',geschlossen:'Keine Abgaben mehr',freigegeben:'Azubis sehen ihre Note'};
 const flow=`<ol class="flow" aria-label="Ablauf">${order.map((s,i)=>`<li class="${i<idx?'done':i===idx?'now':''}" ${i===idx?'aria-current="step"':''}><b>${i<idx?ic('check','sm'):`<span class="n">${i+1}</span>`}${STATUS[s][0]}</b><small>${flowTxt[s]}</small></li>`).join('')}</ol>`;
 let main='',more='';
 const tryBtn=`<button class="btn" data-act="try" data-id="${a.id}">${ic('play','sm')}Als Azubi ausprobieren</button>`;
 if(a.status==='entwurf'){main=`<button class="btn primary" data-act="ln-open" data-id="${a.id}">Termin festlegen und öffnen</button>`;more=tryBtn}
 if(a.status==='offen'){main=`<button class="btn primary" data-act="beamer" data-id="${a.id}">Code groß zeigen</button>`;more=tryBtn+`<button class="btn" data-act="ln-close" data-id="${a.id}">Jetzt beenden …</button>`}
 if(a.status==='geschlossen'){main=`<button class="btn primary" data-act="release" data-id="${a.id}">Ergebnisse freigeben …</button>`;more=`<button class="btn" data-act="na">Notenliste herunterladen</button>`}
 if(a.status==='freigegeben'){more=`<button class="btn" data-act="na">Notenliste herunterladen</button><button class="btn" data-act="na">Drucken</button>`}
 more+=`<button class="icon-btn outline" data-act="menu-ln" data-id="${a.id}" aria-label="Weitere Aktionen">${ic('more')}</button>`;
 const r=results(a);
 const facts=`<dl class="facts"><div><dt>Klasse</dt><dd>${esc(a.klasse)||'–'}</dd></div><div><dt>Termin</dt><dd>${a.datum?`${fmtD(a.datum)}, ${a.beginn} Uhr`:'noch keiner'}</dd></div><div><dt>Zeit zum Schreiben</dt><dd>${a.dauer} Minuten</dd></div><div><dt>Beitreten bis</dt><dd>${a.datum?`${addMin(a.beginn,a.beitritt)} Uhr`:'–'}</dd></div><div><dt>Code</dt><dd>${a.code?`<span class="code">${a.code}</span>${a.status==='offen'?` <button class="icon-btn" style="width:32px;height:32px;display:inline-grid;vertical-align:middle" data-act="copy" data-text="${a.code}" aria-label="Code kopieren">${ic('copy','sm')}</button>`:''}`:'entsteht beim Öffnen'}</dd></div><div><dt>Notenschlüssel</dt><dd>${esc(tpl(a.key).name)}</dd></div></dl>`;
 const showRes=a.status==='geschlossen'||a.status==='freigegeben';
 const tab=S.detailTab[a.id]||(showRes?'ergebnisse':'aufgaben');
 const tabs=`<div class="tabs" role="tablist">${showRes?`<button role="tab" aria-selected="${tab==='ergebnisse'}" data-act="dtab" data-id="${a.id}" data-tab="ergebnisse">Ergebnisse<span class="cnt">${r.rows.length}</span></button>`:''}<button role="tab" aria-selected="${tab==='aufgaben'}" data-act="dtab" data-id="${a.id}" data-tab="aufgaben">Fragen<span class="cnt">${a.qids.length}</span></button></div>`;
 let body='';
 if(tab==='ergebnisse'&&showRes){
  body=`${a.status==='geschlossen'?`<div class="note o" style="margin-bottom:16px">${ic('eye')}<span><b>Die Azubis sehen ihre Noten noch nicht.</b> Prüfe die Ergebnisse und gib sie dann oben mit „Ergebnisse freigeben“ frei.</span></div>`:''}
  <div class="row" style="margin-bottom:12px"><span><b>${r.rows.length} von ${a.people.length}</b> haben abgegeben</span><span class="muted">·</span><span>Durchschnitt <b>${dec(r.avg)}</b></span>${r.missing.length?`<span class="muted">· nicht abgegeben: ${r.missing.map(p=>esc(p.name)).join(', ')}</span>`:''}</div>
  <div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Punkte</th><th>Note</th><th>Fenster verlassen</th></tr></thead><tbody>
  ${r.rows.sort((x,y)=>x.name.localeCompare(y.name)).map(p=>`<tr><td>${esc(p.name)}</td><td class="tabnum">${p.pts} von ${r.max} <span class="muted small">(${p.pct} %)</span></td><td class="tabnum"><b>${p.note}</b></td><td>${p.fokus?`<span class="pill o">${p.fokus}×</span>`:'<span class="faint">–</span>'}</td></tr>`).join('')}
  </tbody></table></div>`}
 else{const st=itemStats(a);
  body=`${showRes?`<p class="muted small" style="margin-bottom:12px;max-width:70ch"><b>Trennt gut</b> heißt: Wer insgesamt gut war, hatte diese Frage öfter richtig als die Schwächeren. <b>Trennt kaum</b> kann auf eine missverständliche Frage hinweisen.</p>`:''}
  <div class="card"><ul class="qlist">${a.qids.map((qid,k)=>{const x=qById(qid);if(!x)return '';const s=st[k];return `<li><div class="qmain"><p class="qtext">${k+1}. ${esc(x.text)}</p><div class="qmeta"><span>${esc(where(x))}</span><span>· ${x.diff}</span>${s?`<span>· ${s.p} % richtig</span><span class="pill ${s.trennt==='kaum'?'o':''}">trennt ${s.trennt}</span>`:''}</div></div></li>`}).join('')}</ul></div>`}
 return `<header class="ph"><div><h1>${esc(a.titel)}</h1><p>${statusPill(a)} <span style="margin-left:6px">${statusLine(a)}</span></p></div><div class="ph-act">${more}${main}</div></header>${flow}${facts}${tabs}${body}`}

/* ---------- Assistent: Leistungsnachweis in 3 Schritten ---------- */
function newWiz(extra){S.wiz={step:1,fach:'',topic:'',stufe:'alle',n:10,mix:'gemischt',qids:[],extra:extra||[],basis:'',titel:'',klasse:'',datum:'',beginn:'08:00',dauer:45,beitritt:10,key:'ihk',mischen:true,fokus:true,err:{},addq:''}}
function wizPool(w){return liveQs().filter(x=>x.visible&&topicInfo(x.topic).s.id===w.fach&&(!w.topic||x.topic===w.topic)&&(w.stufe==='alle'||topicInfo(x.topic).t.stufe==w.stufe))}
function suggest(pool,n,mix){const r=rng(pool.length*31+n);const sh=pool.map(x=>[r(),x]).sort((a,b)=>a[0]-b[0]).map(p=>p[1]);const by=d=>sh.filter(x=>x.diff===d);
 let order;if(mix==='leicht')order=[...by('leicht'),...by('mittel'),...by('schwer')];else if(mix==='schwer')order=[...by('schwer'),...by('mittel'),...by('leicht')];
 else{const L=by('leicht'),M=by('mittel'),H=by('schwer');order=[];const pat=['mittel','leicht','mittel','schwer','leicht','mittel'];let i=0;while(L.length||M.length||H.length){const want=pat[i++%pat.length];const src=want==='leicht'?L:want==='mittel'?M:H;const x=src.shift()||M.shift()||L.shift()||H.shift();if(x)order.push(x)}}
 return order.slice(0,n).map(x=>x.id)}
function vWizard(){if(!S.wiz)newWiz();const w=S.wiz;
 const steps=['Was?','Prüfen','Wann & für wen?'];
 const head=`<header class="ph"><div><h1>Neuer Leistungsnachweis</h1><p>Bereich ${bereichName()} · drei Schritte, nichts ist sichtbar, bevor du ihn öffnest.</p></div></header>
 <ol class="wizsteps">${steps.map((s,i)=>`<li class="${i+1<w.step?'done':''}" ${i+1===w.step?'aria-current="step"':''}><span class="n">${i+1<w.step?ic('check','sm'):i+1}</span>${s}</li>`).join('')}</ol>`;
 let body='';
 if(w.step===1)body=wizStep1(w);else if(w.step===2)body=wizStep2(w);else body=wizStep3(w);
 const foot=`<div class="wiz-foot">${w.step>1?`<button class="btn" data-act="wiz-back">Zurück</button>`:`<a class="btn ghost" href="#nachweise">Abbrechen</a>`}<div class="r">${w.step===3?`<button class="btn" data-act="wiz-draft">Als Entwurf speichern</button><button class="btn primary" data-act="wiz-create">Nachweis anlegen</button>`:`<button class="btn primary" data-act="wiz-next">${w.step===1?'Fragen vorschlagen':'Weiter'}</button>`}</div></div>`;
 return head+`<div class="wiz">${body}${foot}</div>`}
function seg(name,val,opts,label){return `<div class="seg" role="radiogroup" aria-label="${label}">${opts.map(([v,l])=>`<button type="button" role="radio" aria-checked="${String(val)===String(v)}" data-act="seg" data-name="${name}" data-val="${v}">${l}</button>`).join('')}</div>`}
function wizStep1(w){const subs=subjects();const s=subs.find(x=>x.id===w.fach);
 const topics=s?s.topics.filter(t=>w.stufe==='alle'||t.stufe==w.stufe):[];
 const avail=w.fach?wizPool(w).length:0;
 return `<div class="card card-pad stack">
  <div class="field"><span class="lbl">Bereich</span><span>${bereichName()} <span class="muted small">(oben links umstellen)</span></span></div>
  <div class="field"><span class="lbl" id="l-stufe">Stufe</span>${seg('stufe',w.stufe,[['alle','Alle'],['10','10'],['11','11'],['12','12']],'Stufe')}</div>
  <div class="grid2">
   <div class="field"><label for="w-fach">Fach</label><select class="inp" id="w-fach" data-chg="w-fach"><option value="">Fach wählen …</option>${subs.map(x=>`<option value="${x.id}" ${w.fach===x.id?'selected':''}>${x.kurz} – ${esc(x.name)}</option>`).join('')}</select>${w.err.fach?`<span class="err">${w.err.fach}</span>`:''}</div>
   <div class="field"><label for="w-topic">Thema</label><select class="inp" id="w-topic" data-chg="w-topic" ${s?'':'disabled'}><option value="">${s?'Alle Themen in '+s.kurz:'Erst ein Fach wählen'}</option>${topics.map(t=>`<option value="${t.id}" ${w.topic===t.id?'selected':''}>${esc(t.name)} (Stufe ${t.stufe})</option>`).join('')}</select></div>
  </div>
  <div class="grid2">
   <div class="field"><label for="w-n">Anzahl Fragen</label><div class="stepper"><button type="button" data-act="w-n" data-d="-1" aria-label="Eine weniger">−</button><input id="w-n" inputmode="numeric" value="${w.n}" data-inp="w-n" aria-label="Anzahl Fragen"><button type="button" data-act="w-n" data-d="1" aria-label="Eine mehr">+</button></div>${w.fach?`<span class="hint" id="w-avail">${avail} passende Fragen vorhanden</span>`:''}${w.err.n?`<span class="err">${w.err.n}</span>`:''}</div>
   <div class="field"><span class="lbl">Schwierigkeit</span>${seg('mix',w.mix,[['gemischt','Gemischt'],['leicht','Eher leicht'],['schwer','Eher schwer']],'Schwierigkeit')}</div>
  </div>
  ${w.extra.length?`<div class="note">${ic('plus')}<span>Dazu kommt ${w.extra.length===1?'die Frage':'die Fragen'} aus „Schwierig“: <b>${w.extra.map(id=>esc(qById(id).text)).join(' · ')}</b></span></div>`:''}
 </div>`}
function wizStep2(w){const qs=w.qids.map(qById).filter(Boolean);const cnt=d=>qs.filter(x=>x.diff===d).length;
 return `<div class="stack"><div class="row"><h2 style="flex:1">${qs.length} Fragen vorgeschlagen</h2><span class="muted small">${qs.length} Punkte · leicht ${cnt('leicht')} · mittel ${cnt('mittel')} · schwer ${cnt('schwer')}</span></div>
 <p class="muted">Sieh dir die Fragen an. Tausche aus, was nicht passt, oder ergänze eigene.</p>
 <div class="card">${qs.length?`<ol class="sel-list">${qs.map((x,i)=>`<li><span class="num">${i+1}.</span><div class="qmain"><p class="qtext">${esc(x.text)}</p><div class="qmeta"><span>${esc(where(x))}</span><span>· ${x.diff}</span><span>· richtig: ${esc(x.answers[x.correct])}</span></div></div><div class="qa"><button class="btn" data-act="w-swap" data-id="${x.id}">${ic('swap','sm')}Tauschen</button><button class="btn ghost" data-act="w-rm" data-id="${x.id}">Entfernen</button></div></li>`).join('')}</ol>`:`<div class="empty"><b>Keine Fragen ausgewählt</b><span>Ergänze unten Fragen über die Suche.</span></div>`}</div>
 <section class="card card-pad stack"><h3>Frage ergänzen</h3><div class="filters" style="margin:0"><div class="search-inp">${ic('search')}<input class="inp" type="search" id="w-add" placeholder="Stichwort, z. B. Konnossement" value="${esc(w.addq)}" data-inp="w-add" aria-label="Frage zum Ergänzen suchen"></div></div><div id="w-addres">${wizAddRes(w)}</div></section>
 ${w.err.q?`<span class="err" style="color:var(--red);font-weight:600">${w.err.q}</span>`:''}</div>`}
function wizAddRes(w){if(!w.addq.trim())return `<p class="muted small">Sucht in allen Fragen des Bereichs ${bereichName()}.</p>`;const res=liveQs().filter(x=>x.visible&&!w.qids.includes(x.id)&&matches(x,w.addq));
 if(!res.length)return `<p class="muted small">Keine passende Frage gefunden.</p>`;
 return `<ul class="sel-list" style="margin:0 -16px">${res.slice(0,8).map(x=>`<li><div class="qmain"><p>${hl(x.text,w.addq)}</p><div class="qmeta">${esc(where(x))} · ${x.diff}</div></div><div class="qa"><button class="btn" data-act="w-add" data-id="${x.id}">${ic('plus','sm')}Hinzufügen</button></div></li>`).join('')}</ul>${res.length>8?`<p class="muted small">… und ${res.length-8} weitere. Suche genauer.</p>`:''}`}
function wizStep3(w){const fri=nextWd(5),mon=nextWd(1),tom=new Date(TODAY);tom.setDate(tom.getDate()+1);
 const chips=[[isoOf(tom),'Morgen'],[isoOf(fri),'Nächster Freitag'],[isoOf(mon),'Nächster Montag']].filter((c,i,arr)=>arr.findIndex(d=>d[0]===c[0])===i);
 const t=tpl(w.key);
 return `<div class="card card-pad stack">
  <div class="field"><label for="w-titel">Titel</label><input class="inp" id="w-titel" value="${esc(w.titel)}" data-inp="w-titel" placeholder="z. B. LN 2 – Seefracht">${w.err.titel?`<span class="err">${w.err.titel}</span>`:''}</div>
  <div class="field"><label for="w-klasse">Klasse</label><input class="inp" id="w-klasse" list="klassen" value="${esc(w.klasse)}" data-inp="w-klasse" placeholder="z. B. SP10C" style="max-width:220px"><datalist id="klassen">${['SP10A','SP10B','SP10C','SP11A','SP11B','SP12A','TO10A','TO11A'].map(k=>`<option value="${k}">`).join('')}</datalist><span class="hint">Steht auf der Notenliste und hilft beim Wiederfinden.</span>${w.err.klasse?`<span class="err">${w.err.klasse}</span>`:''}</div>
  <div class="field"><label for="w-datum">Datum</label><div class="row"><input class="inp" type="date" id="w-datum" value="${w.datum}" data-chg="w-datum" style="max-width:200px">${chips.map(([v,l])=>`<button type="button" class="chip" aria-pressed="${w.datum===v}" data-act="w-date" data-val="${v}">${l} (${fmtDs(v)})</button>`).join('')}</div>${w.err.datum?`<span class="err">${w.err.datum}</span>`:''}</div>
  <div class="grid2">
   <div class="field"><label for="w-beginn">Beginn</label><input class="inp" type="time" id="w-beginn" value="${w.beginn}" data-chg="w-beginn" style="max-width:160px"></div>
   <div class="field"><label for="w-dauer">Zeit zum Schreiben</label><select class="inp" id="w-dauer" data-chg="w-dauer">${[15,20,30,45,60,90].map(m=>`<option value="${m}" ${w.dauer==m?'selected':''}>${m} Minuten</option>`).join('')}</select></div>
   <div class="field"><label for="w-beitritt">Beitreten möglich bis</label><select class="inp" id="w-beitritt" data-chg="w-beitritt">${[5,10,15,30].map(m=>`<option value="${m}" ${w.beitritt==m?'selected':''}>${m} Minuten nach Beginn (${addMin(w.beginn,m)} Uhr)</option>`).join('')}</select><span class="hint">Wer später kommt, kann nicht mehr beitreten.</span></div>
  </div>
  <div class="field"><label for="w-key">Notenschlüssel</label><div class="row"><select class="inp" id="w-key" data-chg="w-key" style="max-width:300px">${S.templates.map(x=>`<option value="${x.id}" ${w.key===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button type="button" class="btn ghost" data-act="tpl-new">${ic('plus','sm')}Neue Vorlage</button></div><span class="hint">${t.th.map((p,i)=>`${i+1} ab ${p} %`).join(' · ')} · darunter 6</span></div>
  <details class="more"><summary>Weitere Einstellungen</summary><div>
   <label class="check"><input type="checkbox" ${w.mischen?'checked':''} data-chg="w-mischen"><span>Fragen und Antworten für jeden Azubi mischen<br><span class="muted small">Erschwert das Abschreiben.</span></span></label>
   <label class="check"><input type="checkbox" ${w.fokus?'checked':''} data-chg="w-fokus"><span>Melden, wenn jemand das Fenster verlässt<br><span class="muted small">Du siehst danach in den Ergebnissen, wer wie oft gewechselt hat.</span></span></label>
  </div></details>
  <div class="note">${ic('clip')}<span><b>${w.qids.length} Fragen</b> · ${w.datum?`${fmtD(w.datum)}, ${w.beginn}–${addMin(w.beginn,w.dauer)} Uhr`:'Datum fehlt noch'}${w.klasse?' · '+esc(w.klasse):''}</span></div>
 </div>`}

/* ---------- Lerninhalte ---------- */
function vLern(){const li=S.li;const rep=openReports().length;const trash=S.questions.filter(x=>x.deleted&&inBereich(x)).length;
 const tabs=[['fragen','Fragen',selQs().length],['gemeldet','Gemeldet',rep],['schwierig','Schwierig',''],['papierkorb','Papierkorb',trash]];
 return PH('Lerninhalte','Fächer, Themen und Fragen, mit denen die Azubis in der App lernen.',`<button class="icon-btn outline" data-act="menu-li" aria-label="Weitere Aktionen">${ic('more')}</button><button class="btn primary" data-act="add-q">${ic('plus')}Fragen hinzufügen</button>`)+
 `<div class="li"><div><div class="tree-desk card tree">${tree()}</div><details class="tree-mobile card more"><summary>Fach und Thema: ${esc(selLabel())}</summary><div>${tree()}</div></details></div>
 <div style="min-width:0"><div class="tabs" role="tablist">${tabs.map(([k,l,c])=>`<button role="tab" aria-selected="${li.tab===k}" data-act="li-tab" data-tab="${k}">${l}${c!==''?`<span class="cnt">${c}</span>`:''}</button>`).join('')}</div>
 <div id="lipane">${lernPane()}</div></div></div>`}
function selLabel(){const s=S.li.sel;if(s==='all')return 'Alle Fächer';const [k,id]=s.split(':');if(k==='f'){const x=S.subjects.find(y=>y.id===id);return x.kurz}const i=topicInfo(id);return `${i.s.kurz} › ${i.t.name}`}
function selQs(){const all=liveQs();const s=S.li.sel;if(s==='all')return all;const [k,id]=s.split(':');if(k==='f')return all.filter(x=>topicInfo(x.topic).s.id===id);return all.filter(x=>x.topic===id)}
function tree(){const li=S.li;const tot=liveQs().length;
 return `<div class="tnode"><button class="tbtn" data-act="sel" data-sel="all" aria-current="${li.sel==='all'}"><span class="nm">Alle Fächer</span><span class="c">${tot}</span></button></div>`+

function qList(){const li=S.li;const searching=li.q.trim().length>0;let list=searching?liveQs().filter(x=>matches(x,li.q)):selQs();
 if(li.vis==='sichtbar')list=list.filter(x=>x.visible);if(li.vis==='aus')list=list.filter(x=>!x.visible);

 if(!list.length)return `<div class="card">${head}<div class="empty">${ic('search')}<b>${searching?'Keine Frage gefunden':'Hier gibt es noch keine Fragen'}</b>${searching?'<span>Prüfe die Schreibweise oder suche nach einem einzelnen Wort.</span>':`<button class="btn primary" data-act="add-q">${ic('plus')}Fragen hinzufügen</button>`}</div></div>`;

function paneReports(){const rs=openReports();if(!rs.length)return `<div class="card empty">${ic('flag')}<b>Keine offenen Meldungen</b><span>Wenn Azubis eine Frage melden, erscheint sie hier.</span></div>`;

function paneHard(){const ids=Object.keys(S.stats).filter(id=>{const x=qById(id);return x&&!x.deleted&&inBereich(x)}).sort((a,b)=>S.stats[a][0]-S.stats[b][0]);

function paneTrash(){const list=S.questions.filter(x=>x.deleted&&inBereich(x));if(!list.length)return `<div class="card empty">${ic('trash')}<b>Der Papierkorb ist leer</b></div>`;

function parseKI(t){const blocks=t.split(/\n(?=\s*Frage\s*:)/i);const out=[];for(const b of blocks){const g=k=>b.split('\n').filter(l=>new RegExp('^\\s*'+k+'\\s*:','i').test(l)).map(l=>l.replace(/^[^:]*:\s*/,'').trim());const f=g('Frage')[0],r=g('Richtig')[0],w=g('Falsch'),e=g('Erklärung')[0]||'';if(f&&r&&w.length)out.push({text:f,answers:[r,...w.slice(0,3)],erkl:e})}return out}
function parseCSV(t){const lines=t.split(/\r?\n/).filter(l=>l.trim());const out=[];for(const l of lines){const sep=l.includes(';')?';':',';const c=l.split(sep).map(s=>s.trim());if(/^frage$/i.test(c[0]))continue;if(c.length>=3&&c[0]&&c[1])out.push({text:c[0],answers:c.slice(1,5),erkl:c[5]||''})}return out}

 'm-copy':()=>{const m=S.mat;const ti=topicInfo(m.topic);copyText(`Erstelle ${m.n} Multiple-Choice-Fragen für Auszubildende (${bereichName()}, Stufe ${ti.t.stufe}) zum Thema „${ti.t.name}“ aus dem folgenden Text. Frage nach dem, was im Unterricht wichtig ist, nicht nach Einzelzahlen. Schreibe jede Frage genau so:\nFrage: …\nRichtig: …\nFalsch: …\nFalsch: …\nFalsch: …\nErklärung: …\n\n[Text aus ${m.file}]`)},
 'm-sampleans':()=>{S.mat.answer=SAMPLE;renderMat()},
 'm-take':()=>{const m=S.mat;const ti=topicInfo(m.topic);let n=0;m.parsed.forEach((p,i)=>{if(!m.keep[i])return;n++;const id='q'+(++qn);const ans=[...p.answers];while(ans.length<4)ans.push('–');const c=(qn*3+1)%4;const rest=ans.slice(1,4);rest.splice(c,0,ans[0]);S.questions.push({id,topic:m.topic,diff:'mittel',text:p.text,answers:rest,correct:c,erkl:p.erkl,visible:true,hiddenNote:'',deleted:false,deletedNote:''})});closeModal();S.li.sel='t:'+m.topic;S.li.open[ti.s.id]=true;S.li.q='';S.li.tab='fragen';if(route()!=='lerninhalte')location.hash='#lerninhalte';else render();toast(`${n} Fragen in „${ti.t.name}“ übernommen`)},
 'e-save':()=>{const e=S.edit,d=e.d;if(!d.topic){e.err='Bitte Fach und Thema wählen.'}else if(!d.text.trim()){e.err='Bitte die Frage eingeben.'}else if(d.answers.some(a=>!a.trim())){e.err='Bitte alle vier Antworten ausfüllen.'}else e.err='';if(e.err){renderEdit();return}
  if(e.id){const x=qById(e.id);Object.assign(x,{topic:d.topic,diff:d.diff,text:d.text.trim(),answers:d.answers.map(a=>a.trim()),correct:d.correct,erkl:d.erkl.trim(),visible:d.visible});if(d.visible)x.hiddenNote=''}
  else S.questions.push({id:'q'+(++qn),topic:d.topic,diff:d.diff,text:d.text.trim(),answers:d.answers.map(a=>a.trim()),correct:d.correct,erkl:d.erkl.trim(),visible:d.visible,hiddenNote:'',deleted:false,deletedNote:''});
  const neu=!e.id;closeSheet();refreshLern();toast(neu?'Frage angelegt':'Gespeichert')},
 'rep-done':t=>{const r=S.reports.find(x=>x.id===t.dataset.id);const ok=t.dataset.mode==='ok';modal(ok?'Meldung abschließen':'Meldung ablehnen',`<div class="field"><label for="rp-text">Antwort an den Azubi</label><textarea class="inp" id="rp-text">${ok?'Danke für deinen Hinweis! Wir haben die Frage überarbeitet.':'Danke für deinen Hinweis! Die Frage ist so richtig, weil …'}</textarea><span class="hint">Der Azubi sieht die Antwort in der Lern-App.</span></div>${ok?'<label class="check"><input type="checkbox" checked id="rp-xp"><span>Als Dank 20 XP schenken</span></label>':''}`,`<button class="btn" data-act="modal-close">Abbrechen</button><button class="btn primary" data-act="rep-ok" data-id="${r.id}">Antwort senden</button>`)},
 'rep-ok':t=>{const i=S.reports.findIndex(x=>x.id===t.dataset.id);S.reports.splice(i,1);closeModal();render();toast('Antwort gesendet')},
 // Übungsprüfungen
 'ue-tog':t=>{for(const tt of S.uebung[S.bereich])for(const s of tt.sets)if(s.id===t.dataset.id){s.frei=!s.frei;render();toast(s.frei?'Für Azubis freigegeben':'Zurückgezogen')}},
 'menu-ue':t=>openPop(t,`${mi('Fragen ansehen','na',{},'','eye')}${mi('Als Leistungsnachweis verwenden …','na',{},'','clip')}`),
 // Testleitung
 'tl-toggle':()=>{TL.open=!TL.open;tlRender()},
 'tl-start':t=>{TL.run={n:Number(t.dataset.n),t0:Date.now(),clicks:0,note:''};TL.open=false;tlRender()},
 'tl-end':t=>{const r=TL.run;TL.log.push({n:r.n,zeit:mmss(Date.now()-r.t0),clicks:r.clicks,ok:t.dataset.ok==='1',note:r.note||'',am:new Date().toLocaleString('de-DE')});saveLog();TL.run=null;tlRender()},
 'tl-copy':()=>copyText('Nr.\tZeit\tKlicks\tErgebnis\tNotiz\tZeitpunkt\n'+TL.log.map(l=>[l.n,l.zeit,l.clicks,l.ok?'geschafft':'abgebrochen',l.note,l.am].join('\t')).join('\n')),
 'tl-clear':()=>{TL.log=[];saveLog();tlRender()},
 'tl-reset':()=>{resetData();closeModal();closeSheet();location.hash='#start';render();toast('Vorschau zurückgesetzt')}
};
function createLn(status){const w=S.wiz;w.err={};if(!w.titel.trim())w.err.titel='Bitte einen Titel eingeben.';if(!w.klasse.trim())w.err.klasse='Bitte die Klasse eingeben.';if(status==='offen'&&!w.datum)w.err.datum='Bitte ein Datum wählen.';if(Object.keys(w.err).length){render();return}
 const C='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const code=status==='offen'?Array.from({length:6},()=>C[Math.floor(Math.random()*C.length)]).join(''):'';
 let a;if(w.editId){a=S.assessments.find(x=>x.id===w.editId)}if(!a){a={id:'n'+Date.now(),bereich:S.bereich,people:[]};S.assessments.unshift(a)}
 Object.assign(a,{titel:w.titel.trim(),klasse:w.klasse.trim().toUpperCase(),datum:w.datum,beginn:w.beginn,dauer:Number(w.dauer),beitritt:Number(w.beitritt),key:w.key,status,qids:[...w.qids],code:code||a.code||''});
 S.wiz=null;location.hash='#nachweis-'+a.id;toast(status==='offen'?`Angelegt. Code ${code}`:'Als Entwurf gespeichert')}

const CHG={
 lnstatus:t=>{S.ln.status=t.value;$('#lnlist').innerHTML=lnList()},
 livis:t=>{S.li.vis=t.value;S.li.shown=20;$('#qlist').innerHTML=qList()},
 vis:t=>{const x=qById(t.dataset.id);x.visible=t.checked;x.hiddenNote=t.checked?'':`Ausgeblendet von dir am ${pad(TODAY.getDate())}.${pad(TODAY.getMonth()+1)}.`;const lab=t.nextElementSibling;if(lab)lab.textContent=t.checked?'Sichtbar':'Aus';
  toast(t.checked?'Wieder für Azubis sichtbar':'Ausgeblendet. Azubis sehen die Frage nicht mehr.',()=>{x.visible=!x.visible;x.hiddenNote=x.visible?'':x.hiddenNote;refreshLern()});setTimeout(()=>{if(route().startsWith('lerninhalte')){const sy=window.scrollY;$('#qlist').innerHTML=qList();window.scrollTo(0,sy)}},250)},
 'w-fach':t=>{S.wiz.fach=t.value;S.wiz.topic='';render()},
 'w-topic':t=>{S.wiz.topic=t.value;render()},
 'w-datum':t=>{S.wiz.datum=t.value;render()},
 'w-beginn':t=>{S.wiz.beginn=t.value||'08:00';render()},
 'w-dauer':t=>{S.wiz.dauer=Number(t.value);render()},
 'w-beitritt':t=>{S.wiz.beitritt=Number(t.value)},
 'w-key':t=>{S.wiz.key=t.value;render()},
 'w-mischen':t=>{S.wiz.mischen=t.checked},'w-fokus':t=>{S.wiz.fokus=t.checked},
 'e-topic':t=>{S.edit.d.topic=t.value},'e-corr':t=>{S.edit.d.correct=Number(t.dataset.i)},'e-vis':t=>{S.edit.d.visible=t.checked},
 'm-topic':t=>{S.mat.topic=t.value},
 'm-file':t=>{const f=t.files&&t.files[0];if(!f)return;S.mat.file=f.name;if(S.mat.mode==='csv'){const rd=new FileReader();rd.onload=()=>{S.mat.csvText=String(rd.result);renderMat()};rd.readAsText(f)}else renderMat()},
 'm-keep':t=>{S.mat.keep[Number(t.dataset.i)]=t.checked;const k=S.mat.keep.filter(Boolean).length;const b=$('#modal [data-act="m-take"]');if(b){b.disabled=!k;b.textContent=`${k} ${k===1?'Frage':'Fragen'} übernehmen`}}
};
const INP={
 lnq:t=>{S.ln.q=t.value;$('#lnlist').innerHTML=lnList()},
 liq:t=>{S.li.q=t.value;S.li.shown=20;$('#qlist').innerHTML=qList()},
 'w-n':t=>{const v=parseInt(t.value,10);if(!isNaN(v))S.wiz.n=Math.max(1,Math.min(60,v))},
 'w-add':t=>{S.wiz.addq=t.value;$('#w-addres').innerHTML=wizAddRes(S.wiz)},
 'w-titel':t=>{S.wiz.titel=t.value},'w-klasse':t=>{S.wiz.klasse=t.value},
 'e-text':t=>{S.edit.d.text=t.value},'e-erkl':t=>{S.edit.d.erkl=t.value},'e-ans':t=>{S.edit.d.answers[Number(t.dataset.i)]=t.value},
 'm-ans':t=>{S.mat.answer=t.value},
 'tl-note':t=>{if(TL.run)TL.run.note=t.value},
 gsearch:t=>gSearch(t.value)
};

/* ---------- Globale Suche ---------- */
function gSearch(v){const p=$('#searchpop');const qq=v.trim();if(!qq){p.hidden=true;return}
 const pages=[['start','Start'],['nachweise','Leistungsnachweise'],['nachweis-neu','Neuer Leistungsnachweis'],['uebungspruefungen','Übungsprüfungen'],['lerninhalte','Lerninhalte'],['werkzeugkiste','Werkzeugkiste'],['abwesenheiten','Abwesenheiten (krank, Fortbildung …)'],['nachschlagen','Nachschlagen (Schulrecht, Checklisten)'],['lehrerzimmer','Lehrerzimmer'],['konto','Mein Konto'],...VERW].filter(([h,l])=>norm(l).includes(norm(qq))).slice(0,4);
 const qs=liveQs().filter(x=>matches(x,qq)).slice(0,5);
 const ln=assessments().filter(a=>norm(a.titel+' '+a.klasse+' '+a.code).includes(norm(qq))).slice(0,3);
 if(!pages.length&&!qs.length&&!ln.length){p.innerHTML=`<p class="muted small" style="padding:10px">Nichts gefunden für „${esc(qq)}“.</p>`;p.hidden=false;return}
 p.innerHTML=`${pages.length?`<div class="ph2">Seiten</div>${pages.map(([h,l])=>`<button data-act="gs-go" data-href="#${h}">${esc(l)}</button>`).join('')}`:''}
 ${qs.length?`<div class="ph2">Fragen</div>${qs.map(x=>`<button data-act="gs-q" data-id="${x.id}">${hl(x.text,qq)}<small>${esc(where(x))}</small></button>`).join('')}`:''}
 ${ln.length?`<div class="ph2">Leistungsnachweise</div>${ln.map(a=>`<button data-act="gs-go" data-href="#nachweis-${a.id}">${esc(a.titel)}<small>${esc(a.klasse)} · ${STATUS[a.status][0]}</small></button>`).join('')}`:''}`;p.hidden=false}
A['gs-go']=t=>{gClose();location.hash=t.dataset.href};
A['gs-q']=t=>{const x=qById(t.dataset.id);gClose();S.li.sel='t:'+x.topic;S.li.open[topicInfo(x.topic).s.id]=true;S.li.q='';S.li.tab='fragen';if(route()!=='lerninhalte')location.hash='#lerninhalte';else render();openEdit(x.id)};
function gClose(){$('#searchpop').hidden=true;$('#gsearch').value=''}
$('#gsearch').addEventListener('keydown',e=>{if(e.key==='Enter'){const b=$('#searchpop button');if(b){e.preventDefault();b.click()}}if(e.key==='Escape')gClose()});

/* ---------- Ereignisse ---------- */
document.addEventListener('click',e=>{if(!e.target.closest('#search'))$('#searchpop').hidden=true;const t=e.target.closest('[data-act]');
 if(!t){if(!e.target.closest('#pop'))closePop();return}
 const a=t.dataset.act;if(a.startsWith('menu-')&&popFor===t){closePop();return}
 const fn=A[a];if(!fn)return;if(t.tagName==='A'&&a!=='wiz-new')return;e.preventDefault();closePop();fn(t,e)});
document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(t&&CHG[t.dataset.chg])CHG[t.dataset.chg](t)});
document.addEventListener('input',e=>{const t=e.target.closest('[data-inp]');if(t&&INP[t.dataset.inp])INP[t.dataset.inp](t)});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#pop').hidden){closePop();return}if($('#modal').innerHTML){closeModal();return}if($('#sheet').innerHTML){closeSheet();return}if(TL.open){TL.open=false;tlRender();return}$('#app').classList.remove('drawer')});
window.addEventListener('resize',closePop);

{const r=route();if(r.startsWith('lerninhalte-'))S.li.tab=r.slice(12)}
render();tlRender();
</script>
